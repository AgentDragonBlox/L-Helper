[package]
name = "lhelper-linux"
version = "1.0.0"
edition = "2021"
description = "Lightweight control tool for Lenovo LOQ, Legion and IdeaPad laptops"
license = "GPL-3.0-or-later"
repository = "https://github.com/AgentDragonBlox/L-Helper"
readme = "README.md"

# The app runs as the signed-in user. Hardware writes go through lhelper-helper (pkexec + polkit), which checks
# every value itself. Shared code (lighting effects, presets, widgets, config) is included from ../src.
[[bin]]
name = "lhelper"
path = "src/main.rs"

[[bin]]
name = "lhelper-helper"
path = "src/bin/lhelper-helper.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.37"
serde_json = "1"
once_cell = "1"
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
nvml-wrapper = "0.13"
libc = "0.2"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# cargo deb (packaging/build-deb.sh)
[package.metadata.deb]
name = "lhelper"
maintainer = "L-Helper contributors <https://github.com/AgentDragonBlox/L-Helper/issues>"
copyright = "L-Helper contributors"
license-file = ["../LICENSE", "0"]
extended-description = """\
Performance modes, power limits, 24-zone keyboard lighting, battery charge modes and \
screen refresh rate for Lenovo LOQ, Legion and IdeaPad laptops, with a tray icon."""
section = "utils"
priority = "optional"
# eframe loads the display libraries at run time, so $auto can't see them
depends = "$auto, pkexec | policykit-1, libegl1, libxkbcommon0, libwayland-client0"
recommends = "gnome-shell-extension-appindicator | plasma-workspace"
assets = [
    ["target/release/lhelper", "usr/bin/", "755"],
    ["target/release/lhelper-helper", "usr/libexec/lhelper/", "755"],
    ["packaging/lhelper.desktop", "usr/share/applications/", "644"],
    ["packaging/io.github.agentdragonblox.lhelper.policy", "usr/share/polkit-1/actions/", "644"],
    ["packaging/70-lhelper.rules", "usr/lib/udev/rules.d/", "644"],
    ["../assets/logo_blue.png", "usr/share/icons/hicolor/256x256/apps/lhelper.png", "644"],
    ["../THIRD_PARTY_NOTICES.md", "usr/share/doc/lhelper/", "644"],
]
maintainer-scripts = "packaging/debian/"
